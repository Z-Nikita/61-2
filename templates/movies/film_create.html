{% extends 'base.html' %}

{% block content %}
<h1 class="mb-3">Добавить фильм</h1>

{% if errors %}
<div class="alert alert-danger">
    <ul class="mb-0">
        {% for e in errors %}
            <li>{{ e }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<form method="post" enctype="multipart/form-data" class="row g-3">
    {% csrf_token %}

    <div class="col-12 col-md-6">
        <label class="form-label">Название</label>
        <input type="text" name="title" class="form-control" value="{{ form_data.title|default:'' }}" required>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Год</label>
        <input type="number" name="year" class="form-control" value="{{ form_data.year|default:'' }}" required>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Категория</label>
        <select name="category" class="form-select">
            <option value="">(не выбрано)</option>
            {% for c in categories %}
                <option value="{{ c.id }}" {% if form_data.category_id == c.id|stringformat:'s' %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Жанры (ManyToMany)</label>
        <select name="genre" class="form-select" multiple size="6">
            {% for g in genres %}
                <option value="{{ g.id }}" {% if form_data.genre_ids and g.id|stringformat:'s' in form_data.genre_ids %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
        </select>
        <div class="form-text">Можно выбрать несколько (Ctrl/⌘ + click).</div>
    </div>

    <div class="col-12">
        <label class="form-label">Изображение (постер)</label>
        <input type="file" name="image" class="form-control" accept="image/*">
    </div>

    <div class="col-12">
        <label class="form-label">Описание</label>
        <textarea name="description" class="form-control" rows="4">{{ form_data.description|default:'' }}</textarea>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-success">Создать</button>
        <a href="/movies/" class="btn btn-outline-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
